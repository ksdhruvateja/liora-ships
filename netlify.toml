# Netlify — Next.js App Router (OpenNext runtime is applied automatically)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."reconcile"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
